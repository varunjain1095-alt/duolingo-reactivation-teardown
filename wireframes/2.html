<!DOCTYPE html>

<html lang="en" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Duolingo-like Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'app-bg': '#131f24',
            'nav-bg': '#18262d',
            'card-blue': '#89d8fb',
            'card-blue-border': '#73c3e8',
            'node-blue': '#58cc02', // Typically green, but image shows blue active
            'node-active-bg': '#58cc02', // Using image color
            'node-gray': '#37464f',
            'node-gray-border': '#2c3940',
            'text-gray': '#4b5563',
            'flag-green': '#009246',
            'flag-white': '#ffffff',
            'flag-red': '#ce2b37',
            'gem-blue': '#1cb0f6',
            'heart-pink': '#ff4b4b',
            'nav-active-bg': '#2b404d',
            'nav-active-border': '#1cb0f6',
            'nav-icon-orange': '#f89a2b',
            'nav-icon-blue': '#1cb0f6',
            'nav-icon-pink': '#ff4b4b',
            'nav-icon-purple': '#c52ce9'
          },
          fontFamily: {
            sans: ['"Nunito"', 'sans-serif'], // closest to standard font
          },
          boxShadow: {
            '3d': '0 4px 0 0 rgba(0,0,0,0.2)',
            'node': '0 6px 0 0 rgba(0,0,0,0.2)',
            'card': '0 4px 0 0 #73c3e8',
            'nav-active': 'inset 0 0 0 2px #1cb0f6'
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap');
    
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #131f24;
      color: white;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom CSS for specific shapes */
    .flag-icon {
      width: 28px;
      height: 20px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }
    .flag-icon div {
      flex: 1;
    }
    
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: white transparent transparent transparent;
      display: block;
      width: 0;
    }
    
    .node-path-line {
      position: absolute;
      width: 2px;
      background-color: #37464f;
      z-index: 0;
    }
  </style>
<!-- Load font awesome for standard icons if needed, though SVG is preferred for exact match -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link data-snapdom="injected-import" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;display=swap" rel="stylesheet"/></head>
<body class="h-screen w-full flex flex-col overflow-hidden bg-app-bg text-white font-sans font-bold select-none">
<!-- BEGIN: Top Status Bar -->
<header class="flex justify-between items-center px-4 py-3 bg-app-bg z-20 sticky top-0">
<!-- Course/Language Select -->
<div class="flex items-center gap-2 cursor-pointer">
<div class="flag-icon border-2 border-transparent">
<div class="bg-[#009246]"></div>
<div class="bg-white"></div>
<div class="bg-[#ce2b37]"></div>
</div>
<span class="text-white text-lg tracking-tight">11</span>
</div>
<!-- Stats -->
<div class="flex items-center gap-4">
<!-- Streak -->
<div class="flex items-center gap-1.5 opacity-50 cursor-pointer" id="streak-indicator">
<svg class="w-6 h-6 fill-current text-[#ff9600]" viewbox="0 0 24 24">
<path d="M11.666 1.458C11.536 1.135 11.233 1 10.916 1a1 1 0 0 0-.909.584C8.618 4.708 6 7.618 6 11.5c0 3.86 2.873 6.5 6 6.5 3.09 0 6-2.618 6-6.5 0-3.921-2.656-6.848-4.045-8.318A7.834 7.834 0 0 0 11.666 1.458zm-1.04 11.542a1 1 0 1 1 2-1 3 3 0 0 0-3 3 1 1 0 1 1-2-1 5.006 5.006 0 0 1 5-5z"></path>
</svg>
<span class="text-white text-base">0</span>
</div>
<!-- Streak Shield Feature Badge -->
<div class="flex items-center cursor-pointer relative" id="streak-shield-icon" title="Streak Shield Active">
<svg class="w-5 h-5 fill-current text-[#1cb0f6]" viewBox="0 0 24 24">
<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"></path>
</svg>
</div>
<!-- Gems -->
<div class="flex items-center gap-1.5 cursor-pointer" id="gems-indicator">
<svg class="w-6 h-6 fill-current text-gem-blue" viewbox="0 0 24 24">
<path d="M12 2l8.5 5.5v9L12 22l-8.5-5.5v-9L12 2zm0 2.8L5.5 8.7v6.6l6.5 4.2 6.5-4.2V8.7L12 4.8z"></path>
</svg>
<span class="text-gem-blue text-base">2312</span>
</div>
<!-- Energy/Hearts -->
<div class="flex items-center gap-1.5 cursor-pointer" id="energy-indicator"><svg class="w-6 h-6 fill-current text-[#ff4b91]" viewbox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg><span class="text-[#ff4b91] text-base">25</span></div>
</div>
</header>
<!-- END: Top Status Bar -->
<!-- BEGIN: Main Content Area (Scrollable) -->
<main class="flex-1 overflow-y-auto relative pb-24 pt-4 px-4 flex flex-col items-center hide-scrollbar">
<!-- Course Update Banner -->
<div class="w-full max-w-md bg-card-blue rounded-2xl p-4 mb-8 relative shadow-card" id="course-update-banner">
<div class="text-white/80 text-xs font-extrabold tracking-wider uppercase mb-1">Section 2, Extra Unit 1</div>
<div class="text-white text-xl font-extrabold leading-tight">Course update: Learn new words</div>
</div>
<!-- Node Path Container -->
<div class="relative w-full max-w-sm flex flex-col items-center mt-4">
<!-- Active Node (START) -->
<div class="relative z-10 flex flex-col items-center mb-8" id="lesson-path-active-node">
<!-- Speech Bubble -->
<div class="bg-white rounded-lg px-4 py-2 mb-3 relative shadow-sm animate-bounce" style="box-shadow: 0 4px 0 0 #e5e7eb;">
<span class="text-[#1cb0f6] text-sm font-extrabold tracking-widest uppercase">Start</span>
<div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[8px] border-r-[8px] border-t-[8px] border-l-transparent border-r-transparent border-t-white"></div>
</div>
<!-- Node Circle -->
<button class="w-[88px] h-[88px] rounded-full bg-[#1cb0f6] flex items-center justify-center relative active:translate-y-2 active:shadow-none transition-all cursor-pointer" style="box-shadow: 0 8px 0 0 #1899d6;">
<div class="absolute inset-2 rounded-full border-4 border-white/20"></div>
<svg class="w-10 h-10 fill-current text-white z-10 relative top-1" viewbox="0 0 24 24">
<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path>
</svg>
</button>
</div>
<!-- Inactive Nodes -->
<div class="relative w-full flex flex-col items-center gap-4 py-4">
<!-- Node 2 (Right offset) -->
<div class="relative z-10 w-full flex justify-center translate-x-12 mb-4">
<button class="w-[72px] h-[72px] rounded-full bg-node-gray flex items-center justify-center relative" style="box-shadow: 0 6px 0 0 var(--tw-colors-node-gray-border, #2c3940);">
<svg class="w-8 h-8 fill-current text-[#4b5e69]" viewbox="0 0 24 24">
<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path>
</svg>
</button>
</div>
<!-- Node 3 (Dumbbell - Further right) -->
<div class="relative z-10 w-full flex justify-center translate-x-16 mb-4">
<button class="w-[72px] h-[72px] rounded-full bg-node-gray flex items-center justify-center relative" style="box-shadow: 0 6px 0 0 var(--tw-colors-node-gray-border, #2c3940);">
<svg class="w-8 h-8 fill-current text-[#4b5e69]" viewbox="0 0 24 24">
<!-- Dumbbell icon approximation -->
<path d="M20.5 8.5h-1v-2h-3v2h-1v-2h-3v2h-2v-2h-3v2h-1v-2h-3v2h-1v7h1v2h3v-2h1v2h3v-2h2v2h3v-2h1v2h3v-2h1v-7zm-14 5H5v-3h1.5v3zm3.5 0h-2v-3h2v3zm4.5 0h-3v-3h3v3zm3.5 0h-2v-3h2v3zm2.5 0h-1.5v-3h1.5v3z"></path>
</svg>
</button>
</div>
<!-- Node 4 (Chest - Center) -->
<div class="relative z-10 w-full flex justify-center mb-4">
<!-- Chest icon representation -->
<button class="w-[88px] h-[72px] rounded-xl bg-[#2c3940] flex items-center justify-center relative overflow-hidden" style="box-shadow: 0 6px 0 0 #1b2327;">
<!-- Chest details -->
<div class="absolute top-0 w-full h-1/2 bg-[#37464f] border-b-4 border-[#1b2327]"></div>
<div class="absolute w-[60%] h-4 bg-[#1b2327] rounded-full top-1/2 -translate-y-1/2 z-10"></div>
<div class="absolute w-6 h-6 bg-[#4b5e69] rounded-full top-1/2 -translate-y-1/2 z-20 border-4 border-[#1b2327]"></div>
<!-- Straps -->
<div class="absolute left-3 w-4 h-full bg-[#1b2327]"></div>
<div class="absolute right-3 w-4 h-full bg-[#1b2327]"></div>
</button>
</div>
<!-- Node 5 (Headphones - Left offset) -->
<div class="relative z-10 w-full flex justify-center -translate-x-4 mb-4">
<button class="w-[72px] h-[72px] rounded-full bg-node-gray flex items-center justify-center relative" style="box-shadow: 0 6px 0 0 var(--tw-colors-node-gray-border, #2c3940);">
<svg class="w-8 h-8 fill-current text-[#4b5e69]" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9v7c0 1.1.9 2 2 2h4v-8H5v-1c0-3.87 3.13-7 7-7s7 3.13 7 7v1h-4v8h4c1.1 0 2-.9 2-2v-7c0-4.97-4.03-9-9-9z"></path>
</svg>
</button>
</div>
<!-- Node 6 (Left offset further) -->
<div class="relative z-10 w-full flex justify-center -translate-x-12 mb-4">
<button class="w-[72px] h-[72px] rounded-full bg-node-gray flex items-center justify-center relative" style="box-shadow: 0 6px 0 0 var(--tw-colors-node-gray-border, #2c3940);">
<svg class="w-8 h-8 fill-current text-[#4b5e69]" viewbox="0 0 24 24">
<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path>
</svg>
</button>
</div>
<!-- Node 7 (Bottom cut off) -->
<div class="relative z-10 w-full flex justify-center -translate-x-16 mb-4 opacity-80">
<button class="w-[72px] h-[72px] rounded-full bg-node-gray flex items-center justify-center relative" style="box-shadow: 0 6px 0 0 var(--tw-colors-node-gray-border, #2c3940);">
<svg class="w-8 h-8 fill-current text-[#4b5e69]" viewbox="0 0 24 24">
<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"></path>
</svg>
</button>
</div>
</div>
</div>
</main>
<!-- END: Main Content Area -->
<!-- BEGIN: Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full bg-[#09151a] border-t border-[#2a373c] px-2 pb-safe z-30 h-[72px]">
<ul class="flex justify-around items-center h-full">
<li class="flex-1 flex justify-center" id="nav-home">
<button class="w-12 h-12 rounded-xl flex items-center justify-center transition-transform active:scale-95 bg-nav-active-bg shadow-nav-active" aria-label="Home">
<svg class="w-8 h-8 fill-current text-[#1cb0f6]" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"></path></svg>
</button>
</li>
<li class="flex-1 flex justify-center" id="nav-practice">
<button class="w-12 h-12 flex items-center justify-center transition-transform active:scale-95 text-[#77858f] hover:text-white" aria-label="Practice">
<svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M6 5v14H4V5h2m14 0v14h-2V5h2M2 9v6H0V9h2m22 0v6h-2V9h2M17 11H7v2h10v-2z"></path></svg>
</button>
</li>
<li class="flex-1 flex justify-center" id="nav-league">
<button class="w-12 h-12 flex items-center justify-center transition-transform active:scale-95 text-[#f89a2b]" aria-label="League">
<svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 003.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"></path></svg>
</button>
</li>
<li class="flex-1 flex justify-center" id="nav-feed">
<button class="w-12 h-12 flex items-center justify-center transition-transform active:scale-95 text-[#ff4b4b]" aria-label="Feed">
<svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg>
</button>
</li>
<li class="flex-1 flex justify-center" id="nav-bird">
<button class="w-12 h-12 flex items-center justify-center transition-transform active:scale-95 text-[#58cc02]" aria-label="Learn">
<svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#58cc02"></circle><circle cx="9" cy="10" r="2.5" fill="white"></circle><circle cx="15" cy="10" r="2.5" fill="white"></circle><circle cx="9.5" cy="10" r="1.2" fill="#1b2327"></circle><circle cx="14.5" cy="10" r="1.2" fill="#1b2327"></circle><polygon points="12,11 10,14 14,14" fill="#ff9600"></polygon></svg>
</button>
</li>
<li class="flex-1 flex justify-center" id="nav-more">
<button class="w-12 h-12 flex items-center justify-center transition-transform active:scale-95 text-[#c52ce9]" aria-label="More">
<svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5"></circle><circle cx="12" cy="12" r="2.5"></circle><circle cx="19" cy="12" r="2.5"></circle></svg>
</button>
</li>
</ul>
</nav>
<!-- END: Bottom Navigation Bar -->
<style data-purpose="scrollbar-hiding">
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</body></html>

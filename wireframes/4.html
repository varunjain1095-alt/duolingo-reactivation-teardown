<!DOCTYPE html>

<html lang="en" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Practice Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
    body {
      font-family: 'Nunito', sans-serif;
    }
  </style>
<style data-purpose="custom-utilities">
    .bg-duo-blue { background-color: #28a8ef; }
    .bg-duo-card-blue { background-color: #49bdf3; }
    .text-duo-blue { color: #28a8ef; }
    .bg-duo-dark { background-color: #1a2228; }
    .bg-duo-dark-card { background-color: #202931; }
    .border-duo-dark-border { border-color: #37464f; }
    .shadow-duo-button { box-shadow: 0 4px 0 #e5e5e5; }
    .shadow-duo-card { box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
    .text-duo-gray { color: #77858f; }
  </style>
<link data-snapdom="injected-import" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet"/></head>
<body class="bg-duo-dark min-h-screen text-white select-none pb-24">
<!-- BEGIN: Header Section -->
<header class="bg-duo-blue pt-12 pb-6 px-4 fixed top-0 w-full z-10" data-purpose="header">
<h1 class="text-2xl font-bold tracking-tight">Practice</h1>
</header>
<!-- END: Header Section -->
<!-- BEGIN: Main Content -->
<main class="pt-24" data-purpose="main-content">
<!-- Top Blue Area Background -->
<div class="bg-duo-blue h-[280px] absolute top-0 left-0 w-full -z-10"></div>
<!-- BEGIN: Unit Rewind Card -->
<section class="px-4 mt-2 relative z-0">
<div class="bg-duo-card-blue rounded-2xl p-6 relative overflow-hidden flex flex-col justify-between h-[240px]" id="unit-rewind-card">
<div class="w-3/5 z-10">
<h2 class="text-xl font-extrabold mb-2 text-white">Unit Rewind</h2>
<p class="text-white/90 text-sm font-bold leading-tight mb-6">Keep your memory fresh with this review of Unit 3!</p>
<button class="bg-white text-duo-blue font-extrabold tracking-wider text-sm py-3 px-6 rounded-xl shadow-duo-button uppercase active:translate-y-1 active:shadow-none transition-all" id="unit-rewind-start-button">
            Start +20 XP
          </button>
</div>
<!-- Mascot Illustration -->
<div class="absolute bottom-0 right-0 w-[180px] h-[180px] pointer-events-none">
<!-- Stand-in for complex SVG illustration -->
<svg class="w-full h-full" preserveaspectratio="xMidYMax meet" viewbox="0 0 100 100">
<!-- Background Coin -->
<ellipse cx="50" cy="85" fill="#ffc800" rx="40" ry="12"></ellipse>
<ellipse cx="50" cy="83" fill="#ffd900" rx="40" ry="12"></ellipse>
<!-- Bird -->
<circle cx="55" cy="50" fill="#58cc02" r="30"></circle>
<!-- Eyes -->
<path d="M45 40 Q50 35 55 40" fill="none" stroke="white" stroke-linecap="round" stroke-width="4"></path>
<path d="M65 40 Q70 35 75 40" fill="none" stroke="white" stroke-linecap="round" stroke-width="4"></path>
<!-- Beak -->
<polygon fill="#ff9600" points="55,45 65,45 60,55"></polygon>
<!-- Props -->
<circle cx="25" cy="30" fill="#8975ff" r="15"></circle>
<circle cx="85" cy="40" fill="#ff7bb4" r="15"></circle>
</svg>
</div>
</div>
</section>
<!-- END: Unit Rewind Card -->
<!-- BEGIN: Conversation Section -->
<section class="px-4 mt-8" data-purpose="conversation-section">
<div class="flex justify-between items-end mb-3 px-1">
<h3 class="text-duo-gray font-extrabold tracking-widest text-sm uppercase">Conversation</h3>
<span class="bg-gradient-to-r from-teal-400 to-purple-500 text-white font-black italic text-xs px-2 py-1 rounded">SUPER</span>
</div>
<div class="bg-duo-dark-card border-2 border-duo-dark-border rounded-2xl p-4 flex justify-between items-center relative" id="video-call-btn">
<span class="font-extrabold text-xl">Video Call</span>
<div class="w-16 h-16 bg-purple-400 rounded-full flex items-center justify-center border-4 border-duo-dark">
<svg class="w-8 h-8 text-white" fill="currentColor" viewbox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"></path></svg>
</div>
<div class="absolute -top-3 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-md border-2 border-duo-dark shadow">NEW</div>
</div>
</section>
<!-- END: Conversation Section -->
<!-- BEGIN: Skill Practice Section -->
<section class="px-4 mt-8" data-purpose="skill-practice-section">
<h3 class="text-duo-gray font-extrabold tracking-widest text-sm uppercase mb-3 px-1">Skill Practice</h3>
<div class="flex flex-col gap-3">
<!-- Mistakes -->
<div class="bg-duo-dark-card border-2 border-duo-dark-border rounded-2xl p-4 flex justify-between items-center relative">
<span class="font-extrabold text-xl">Mistakes</span>
<div class="w-16 h-16 bg-orange-500 rounded-full flex items-center justify-center border-4 border-duo-dark">
<svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
<div class="absolute -top-3 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full border-2 border-duo-dark shadow">30+</div>
</div>
<!-- Words -->
<div class="bg-duo-dark-card border-2 border-duo-dark-border rounded-2xl p-4 flex justify-between items-center relative">
<span class="font-extrabold text-xl">Words</span>
<div class="w-16 h-16 bg-blue-500 rounded-lg transform rotate-12 flex items-center justify-center border-4 border-duo-dark relative z-10">
<div class="absolute w-full h-full bg-blue-400 rounded-lg -rotate-12 -z-10 -ml-2 -mt-2"></div>
</div>
<div class="absolute -top-3 -right-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-md border-2 border-duo-dark shadow z-20">NEW</div>
</div>
<!-- Listen -->
<div class="bg-duo-dark-card border-2 border-duo-dark-border rounded-2xl p-4 flex justify-between items-center">
<span class="font-extrabold text-xl">Listen</span>
<div class="w-16 h-16 bg-blue-400 rounded-full flex items-center justify-center border-4 border-duo-dark">
<svg class="w-8 h-8 text-white" fill="currentColor" viewbox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path></svg>
</div>
</div>
</div>
</section>
<!-- END: Skill Practice Section -->
</main>
<!-- END: Main Content -->
<!-- BEGIN: Bottom Navigation -->
<nav class="fixed bottom-0 w-full bg-[#09151a] border-t-2 border-duo-dark-border flex justify-around items-center h-20 px-2" data-purpose="bottom-nav">
<!-- Home -->
<button class="p-2 flex flex-col items-center justify-center w-12 h-12 text-[#77858f] hover:text-white" id="nav-home" aria-label="Home">
<svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"></path></svg>
</button>
<!-- Practice (Active) -->
<button class="p-2 flex flex-col items-center justify-center w-12 h-12 border-2 border-duo-blue rounded-xl text-[#1cb0f6]" id="nav-practice" aria-label="Practice">
<svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><path d="M6 5v14H4V5h2m14 0v14h-2V5h2M2 9v6H0V9h2m22 0v6h-2V9h2M17 11H7v2h10v-2z"></path></svg>
</button>
<!-- League -->
<button class="p-2 flex flex-col items-center justify-center w-12 h-12 text-[#f89a2b]" id="nav-league" aria-label="League">
<svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 003.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"></path></svg>
</button>
<!-- Feed -->
<button class="p-2 flex flex-col items-center justify-center w-12 h-12 text-[#ff4b4b]" id="nav-feed" aria-label="Feed">
<svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg>
</button>
<!-- Bird -->
<button class="p-2 flex flex-col items-center justify-center w-12 h-12 text-[#58cc02]" id="nav-bird" aria-label="Learn">
<svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#58cc02"></circle><circle cx="9" cy="10" r="2.5" fill="white"></circle><circle cx="15" cy="10" r="2.5" fill="white"></circle><circle cx="9.5" cy="10" r="1.2" fill="#1b2327"></circle><circle cx="14.5" cy="10" r="1.2" fill="#1b2327"></circle><polygon points="12,11 10,14 14,14" fill="#ff9600"></polygon></svg>
</button>
<!-- More -->
<button class="p-2 flex flex-col items-center justify-center w-12 h-12 text-[#c52ce9]" id="nav-more" aria-label="More">
<svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5"></circle><circle cx="12" cy="12" r="2.5"></circle><circle cx="19" cy="12" r="2.5"></circle></svg>
</button>
</nav>
<!-- END: Bottom Navigation -->
</body></html>
